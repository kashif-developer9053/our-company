# New server block for Eldian Core. Does NOT touch the existing site.
#
# NOTE: the existing orbitscanner block is `listen 80 default_server` with
# `server_name _;` — it currently catches EVERY hostname. Give it its real
# name first (server_name scan.orb-itworks.com;) or requests for this new
# subdomain may land on the wrong app.
server {
    listen 80;
    listen [::]:80;
    server_name SUBDOMAIN_PLACEHOLDER;

    # Lead hunts and AI drafting can run for minutes. Nginx defaults to 60s,
    # which would cut those requests off mid-flight.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 25m;

    # Backend under /api — the frontend calls relative paths, so this keeps
    # working unchanged when SSL is added.
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
